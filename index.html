<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Nástěnka</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
            --accent-color: #4caf50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 5px;
            background: var(--card-bg);
            transition: 0.3s;
        }
        nav a.active, nav a:hover {
            color: var(--text-color);
            background: var(--accent-color);
        }
        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { margin-bottom: 15px; font-size: 1.2rem; color: var(--accent-color); border-bottom: 1px solid #333; padding-bottom: 5px; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .date-big { font-size: 1.5rem; font-weight: bold; margin-bottom: 5px; }
        .weather-loc { font-weight: bold; margin-top: 10px; color: #fff; }
        @media (max-width: 600px) {
            body { padding: 10px; }
            nav { gap: 10px; }
            nav a { padding: 8px 12px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="active">🏠 Nástěnka</a>
        <a href="todo.html">✅ To-Do List</a>
        <a href="notes.html">📝 Poznámky & Odkazy</a>
    </nav>

    <div class="container">
        <!-- Karta: Datum a Svátek -->
        <div class="card">
            <h2>Kalendář</h2>
            <div class="date-big" id="current-date">-</div>
            <div class="data-row">
                <span>Dnes má svátek:</span>
                <span id="nameday" style="font-weight: bold; color: #ffeb3b;">Načítání...</span>
            </div>
        </div>

        <!-- Karta: Kurzy měn -->
        <div class="card">
            <h2>Kurzy Měn (ČNB)</h2>
            <div class="data-row">
                <span>EUR / CZK:</span>
                <span id="eur-rate" style="font-weight: bold;">Načítání...</span>
            </div>
            <div class="data-row">
                <span>USD / CZK:</span>
                <span id="usd-rate" style="font-weight: bold;">Načítání...</span>
            </div>
        </div>

        <!-- Karta: Počasí -->
        <div class="card">
            <h2>Předpověď Počasí</h2>
            <div id="weather-data">Načítání počasí...</div>
        </div>
    </div>

    <script>
        // 1. Datum a Svátek v ČR
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('cs-CZ', options);

        async function fetchNameday() {
            try {
                const res = await fetch('https://svatkyapi.cz/api/day');
                const data = await res.json();
                document.getElementById('nameday').innerText = data.name;
            } catch {
                document.getElementById('nameday').innerText = "Chyba načítání";
            }
        }

async function fetchRates() {
    try {
        // Volání přes CORS proxy, která vyřeší blokování v prohlížeči
        const targetUrl = encodeURIComponent('https://cnb.cz');
        const res = await fetch(`https://allorigins.win{targetUrl}`);
        const proxyData = await res.json();
        
        // Data z proxy jsou zabalená v textovém formátu, musíme je naparsovat na JSON
        const data = JSON.parse(proxyData.contents);
        
        const euroData = data.rates.find(r => r.currencyCode === 'EUR');
        const usdData = data.rates.find(r => r.currencyCode === 'USD');
        
        if (euroData && usdData) {
            document.getElementById('eur-rate').innerText = euroData.rate.toFixed(2) + ' Kč';
            document.getElementById('usd-rate').innerText = usdData.rate.toFixed(2) + ' Kč';
        } else {
            throw new Error('Měny nenalezeny');
        }
    } catch (error) {
        console.error("Podrobná chyba:", error);
        document.getElementById('eur-rate').innerText = "Chyba";
        document.getElementById('usd-rate').innerText = "Chyba";
    }
}
        // 3. Počasí (Vřesovice, Bartošovice, Brno) přes Open-Meteo (bez registrace)
        const locations = [
            { name: "Vřesovice", lat: 49.3822, lon: 17.1408 },
            { name: "Bartošovice", lat: 49.6706, lon: 18.0531 },
            { name: "Brno", lat: 49.1951, lon: 16.6068 }
        ];

        async function fetchWeather() {
            const container = document.getElementById('weather-data');
            container.innerHTML = '';
            
            for (let loc of locations) {
                try {
                    const res = await fetch(`https://open-meteo.com{loc.lat}&longitude=${loc.lon}&current_weather=true`);
                    const data = await res.json();
                    const temp = data.current_weather.temperature;
                    const wind = data.current_weather.windspeed;
                    
                    container.innerHTML += `
                        <div class="weather-loc">${loc.name}</div>
                        <div class="data-row">
                            <span>Teplota:</span>
                            <span style="font-weight:bold; color:#2196f3;">${temp} °C</span>
                        </div>
                    `;
                } catch {
                    container.innerHTML += `<div class="weather-loc">${loc.name}: Chyba načítání</div>`;
                }
            }
        }

        // Spuštění funkcí při načtení stránky
        fetchNameday();
        fetchRates();
        fetchWeather();
    </script>
</body>
</html>
