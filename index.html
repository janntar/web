<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Nástěnka</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
            --accent-color: #4caf50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 5px;
            background: var(--card-bg);
            transition: 0.3s;
        }
        nav a.active, nav a:hover {
            color: var(--text-color);
            background: var(--accent-color);
        }
        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { margin-bottom: 15px; font-size: 1.2rem; color: var(--accent-color); border-bottom: 1px solid #333; padding-bottom: 5px; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .date-big { font-size: 1.5rem; font-weight: bold; margin-bottom: 5px; }
        .weather-loc { font-weight: bold; margin-top: 10px; color: #fff; }
        @media (max-width: 600px) {
            body { padding: 10px; }
            nav { gap: 10px; }
            nav a { padding: 8px 12px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="active">🏠 Nástěnka</a>
        <a href="todo.html">✅ To-Do List</a>
        <a href="notes.html">📝 Poznámky & Odkazy</a>
    </nav>

    <div class="container">
        <!-- Karta: Kalendář -->
        <div class="card">
            <h2>Kalendář</h2>
            <div class="date-big" id="current-date">-</div>
            <div class="data-row">
                <span>Dnes má svátek:</span>
                <span id="nameday" style="font-weight: bold; color: #ffeb3b;">Načítání...</span>
            </div>
        </div>

        <!-- Karta: Kurzy měn -->
        <div class="card">
            <h2>Kurzy Měn</h2>
            <div class="data-row">
                <span>EUR / CZK:</span>
                <span id="eur-rate" style="font-weight: bold;">Načítání...</span>
            </div>
            <div class="data-row">
                <span>USD / CZK:</span>
                <span id="usd-rate" style="font-weight: bold;">Načítání...</span>
            </div>
        </div>

        <!-- Karta: Počasí -->
        <div class="card">
            <h2>Předpověď Počasí</h2>
            <div id="weather-data">Načítání počasí...</div>
        </div>
    </div>

    <script>
        // 1. Zobrazení aktuálního českého data
        var options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('cs-CZ', options);

        // Pomocná funkce pro bezpečné vložení skriptu na stránku
        function injectScript(url) {
            var script = document.createElement('script');
            script.src = url;
            document.head.appendChild(script);
        }

        // --- 2. SVÁTEK (PŘES PROXY ALLORIGINS V REŽIMU JSONP) ---
        window.handleNameday = function(response) {
            try {
                var data = JSON.parse(response.contents);
                document.getElementById('nameday').innerText = data.name;
            } catch(e) {
                document.getElementById('nameday').innerText = "Chyba stahování jmenin";
            }
        };
        injectScript('https://allorigins.win' + encodeURIComponent('https://svatkyapi.cz') + '&callback=handleNameday');

        // --- 3. KURZY MĚN (PŘES NEZÁVISLÉ FRANKFURTER API, KTERÉ MÁ NATIVNÍ PODPORU PRO PROHLÍŽEČE) ---
        async function fetchRates() {
            try {
                var res = await fetch('https://frankfurter.dev');
                var data = await res.json();
                
                var czkInEur = data.rates.CZK;
                var usdInEur = data.rates.USD;
                var czkInUsd = czkInEur / usdInEur;
                
                document.getElementById('eur-rate').innerText = czkInEur.toFixed(2) + ' Kč';
                document.getElementById('usd-rate').innerText = czkInUsd.toFixed(2) + ' Kč';
            } catch (error) {
                document.getElementById('eur-rate').innerText = "Chyba sítě";
                document.getElementById('usd-rate').innerText = "Chyba sítě";
            }
        }
        fetchRates();

        // --- 4. PŘEDPOVĚĎ POČASÍ (PŘES OPEN-METEO, KTERÉ MÁ CIZÍ CORS POVOLENÉ) ---
        async function fetchWeather() {
            var container = document.getElementById('weather-data');
            container.innerHTML = '';
            
            var names = ["Vřesovice", "Bartošovice", "Brno"];
            var url = 'https://open-meteo.com';
            
            try {
                var res = await fetch(url);
                var data = await res.json();
                
                for (var i = 0; i < data.length; i++) {
                    var temp = data[i].current.temperature_2m;
                    container.innerHTML += '<div class="weather-loc">' + names[i] + '</div>' +
                                           '<div class="data-row">' +
                                           '<span>Teplota:</span>' +
                                           '<span style="font-weight:bold; color:#2196f3;">' + temp + ' °C</span>' +
                                           '</div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="weather-loc">Chyba stahování počasí</div>';
            }
        }
        fetchWeather();
    </script>
</body>
</html>
