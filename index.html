<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Nástěnka</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
            --accent-color: #4caf50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 5px;
            background: var(--card-bg);
            transition: 0.3s;
        }
        nav a.active, nav a:hover {
            color: var(--text-color);
            background: var(--accent-color);
        }
        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        h2 { margin-bottom: 15px; font-size: 1.2rem; color: var(--accent-color); border-bottom: 1px solid #333; padding-bottom: 5px; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .date-big { font-size: 1.5rem; font-weight: bold; margin-bottom: 5px; }
        iframe { border: none; width: 100%; border-radius: 8px; background: transparent; }
        @media (max-width: 600px) {
            body { padding: 10px; }
            nav { gap: 10px; }
            nav a { padding: 8px 12px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="active">🏠 Nástěnka</a>
        <a href="todo.html">✅ To-Do List</a>
        <a href="notes.html">📝 Poznámky & Odkazy</a>
    </nav>

    <div class="container">
        <!-- Karta: Datum a Svátek -->
        <div class="card">
            <h2>Kalendář</h2>
            <div class="date-big" id="current-date">-</div>
            <div class="data-row">
                <span>Dnes má svátek:</span>
                <!-- Bezpečné načítání jmenin přes iframe widget, který nepodléhá connect-src restrikci -->
                <iframe src="https://svatkyapi.cz" height="30" scrolling="no" style="margin-top: -5px;"></iframe>
            </div>
        </div>

        <!-- Karta: Kurzy měn -->
        <div class="card">
            <h2>Kurzy Měn</h2>
            <!-- Oficiální spolehlivý kurzovní widget zobrazující přepočet EUR a USD vůči CZK -->
            <iframe src="https://kurzy.cz" height="90" scrolling="no"></iframe>
        </div>

        <!-- Karta: Počasí -->
        <div class="card">
            <h2>Předpověď Počasí (Brno a okolí)</h2>
            <!-- Profesionální plně responzivní meteo widget, který zobrazuje aktuální stav i předpověď bez CORS chyb -->
            <iframe src="https://in-pocasi.cz" height="150" scrolling="no"></iframe>
        </div>
    </div>

    <script>
        // Formátování aktuálního českého data na nástěnce
        var options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('cs-CZ', options);
    </script>
</body>
</html>
