<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Nástěnka</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
            --accent-color: #4caf50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 5px;
            background: var(--card-bg);
            transition: 0.3s;
        }
        nav a.active, nav a:hover {
            color: var(--text-color);
            background: var(--accent-color);
        }
        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { margin-bottom: 15px; font-size: 1.2rem; color: var(--accent-color); border-bottom: 1px solid #333; padding-bottom: 5px; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .date-big { font-size: 1.5rem; font-weight: bold; margin-bottom: 5px; }
        .weather-loc { font-weight: bold; margin-top: 10px; color: #fff; }
        @media (max-width: 600px) {
            body { padding: 10px; }
            nav { gap: 10px; }
            nav a { padding: 8px 12px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="active">🏠 Nástěnka</a>
        <a href="todo.html">✅ To-Do List</a>
        <a href="notes.html">📝 Poznámky & Odkazy</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Kalendář</h2>
            <div class="date-big" id="current-date">-</div>
            <div class="data-row">
                <span>Dnes má svátek:</span>
                <span id="nameday" style="font-weight: bold; color: #ffeb3b;">Načítání...</span>
            </div>
        </div>

        <div class="card">
            <h2>Kurzy Měn</h2>
            <div class="data-row">
                <span>EUR / CZK:</span>
                <span id="eur-rate" style="font-weight: bold;">Načítání...</span>
            </div>
            <div class="data-row">
                <span>USD / CZK:</span>
                <span id="usd-rate" style="font-weight: bold;">Načítání...</span>
            </div>
        </div>

        <div class="card">
            <h2>Předpověď Počasí</h2>
            <div id="weather-data">Načítání počasí...</div>
        </div>
    </div>
    <script>
        // 1. Datum
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('cs-CZ', options);

        // 2. Svátek (použijeme spolehlivější netlify endpoint ze svatkyapi)
        async function fetchNameday() {
            try {
                const res = await fetch('https://netlify.app');
                const data = await res.json();
                document.getElementById('nameday').innerText = data.name;
            } catch (e) {
                document.getElementById('nameday').innerText = "Chyba načítání";
            }
        }
        fetchNameday();

        // 3. Kurzy měn (Frankfurter API funguje bez CORS chyb)
        async function fetchRates() {
            try {
                const res = await fetch('https://frankfurter.dev');
                const data = await res.json();
                const czkInEur = data.rates.CZK;
                const usdInEur = data.rates.USD;
                const czkInUsd = czkInEur / usdInEur;
                
                document.getElementById('eur-rate').innerText = czkInEur.toFixed(2) + ' Kč';
                document.getElementById('usd-rate').innerText = czkInUsd.toFixed(2) + ' Kč';
            } catch (e) {
                document.getElementById('eur-rate').innerText = "Chyba";
                document.getElementById('usd-rate').innerText = "Chyba";
            }
        }
        fetchRates();

        // 4. Počasí (URL sestavená po částech, aby se při kopírování nepoškodila)
        const locations = [
            { name: "Vřesovice u Prostějova", lat: 49.3822, lon: 17.1408 },
            { name: "Bartošovice (NJ)", lat: 49.6706, lon: 18.0531 },
            { name: "Brno", lat: 49.1951, lon: 16.6068 }
        ];

        async function fetchWeather() {
            const container = document.getElementById('weather-data');
            container.innerHTML = '';
            
            // Rozdělení URL na bezpečné části
            const base = ['https:/', '://open-meteo.com', 'v1', 'forecast'].join('/');
            
            for (const loc of locations) {
                try {
                    const params = new URLSearchParams({
                        latitude: loc.lat,
                        longitude: loc.lon,
                        current: 'temperature_2m,wind_speed_10m'
                    });
                    
                    const res = await fetch(base + '?' + params.toString());
                    const data = await res.json();
                    
                    container.innerHTML += `
                        <div class="weather-loc">${loc.name}</div>
                        <div class="data-row">
                            <span>Teplota:</span>
                            <span style="font-weight:bold; color:#2196f3;">${data.current.temperature_2m} °C</span>
                        </div>
                        <div class="data-row">
                            <span>Vítr:</span>
                            <span style="font-weight:bold; color:#b3b3b3;">${data.current.wind_speed_10m} km/h</span>
                        </div>
                    `;
                } catch (e) {
                    container.innerHTML += `<div class="weather-loc">${loc.name}: Chyba načítání</div>`;
                }
            }
        }
        fetchWeather();
    </script>


</body>
</html>
