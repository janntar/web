<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poznámky a Odkazy</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
            --accent-color: #2196f3; /* Modrá barva pro poznámky */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 5px;
            background: var(--card-bg);
            transition: 0.3s;
        }
        nav a.active, nav a:hover {
            color: var(--text-color);
            background: var(--accent-color);
        }
        .notes-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { margin-bottom: 20px; color: var(--accent-color); text-align: center; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 1rem;
            resize: vertical;
        }
        button {
            padding: 12px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
        }
        .note-card {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            border-top: 4px solid var(--accent-color);
            position: relative;
            word-break: break-word;
        }
        .note-card p { font-size: 0.95rem; line-height: 1.4; margin-bottom: 30px; }
        .note-card a { color: #4caf50; text-decoration: underline; font-weight: bold; }
        .delete-note {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: #f44336;
            border: none;
            color: white;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
        }
        @media (max-width: 600px) { body { padding: 10px; } nav a { padding: 8px 12px; font-size: 0.9rem; } }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">🏠 Nástěnka</a>
        <a href="todo.html">✅ To-Do List</a>
        <a href="notes.html" class="active">📝 Poznámky & Odkazy</a>
    </nav>

    <div class="notes-container">
        <h2>Moje Poznámky a Odkazy</h2>
        <div class="input-group">
            <textarea id="note-input" placeholder="Sem vložte text poznámky nebo odkaz na produkt z e-shopu..."></textarea>
            <button onclick="addNote()">Uložit poznámku</button>
        </div>
        <div class="notes-grid" id="notes-grid"></div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('notes')) || [];

        function renderNotes() {
            const grid = document.getElementById('notes-grid');
            grid.innerHTML = '';
            notes.forEach((note, index) => {
                const card = document.createElement('div');
                card.className = 'note-card';
                
                // Kontrola, zda text obsahuje odkaz
                let formattedText = note;
                if (note.startsWith('http://') || note.startsWith('https://')) {
                    formattedText = `<a href="${note}" target="_blank">🔗 Otevřít uložený odkaz</a>`;
                }

                card.innerHTML = `
                    <p>${formattedText}</p>
                    <button class="delete-note" onclick="deleteNote(${index})">Smazat</button>
                `;
                grid.appendChild(card);
            });
            localStorage.setItem('notes', JSON.stringify(notes));
        }

        function addNote() {
            const input = document.getElementById('note-input');
            if (input.value.trim() === '') return;
            notes.push(input.value.trim());
            input.value = '';
            renderNotes();
        }

        function deleteNote(index) {
            notes.splice(index, 1);
            renderNotes();
        }

        renderNotes();
    </script>
</body>
</html>
