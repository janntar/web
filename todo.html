<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
            --accent-color: #4caf50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 5px;
            background: var(--card-bg);
            transition: 0.3s;
        }
        nav a.active, nav a:hover {
            color: var(--text-color);
            background: var(--accent-color);
        }
        .todo-box {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { margin-bottom: 20px; color: var(--accent-color); text-align: center; }
        .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            font-size: 1rem;
        }
        button {
            padding: 12px 20px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        ul { list-style: none; }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #252525;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 4px solid var(--accent-color);
        }
        li.completed {
            text-decoration: line-through;
            opacity: 0.5;
            border-left-color: #555;
        }
        .delete-btn { background: #f44336; padding: 6px 12px; font-size: 0.85rem; }
        @media (max-width: 600px) { body { padding: 10px; } nav a { padding: 8px 12px; font-size: 0.9rem; } }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">🏠 Nástěnka</a>
        <a href="todo.html" class="active">✅ To-Do List</a>
        <a href="notes.html">📝 Poznámky & Odkazy</a>
    </nav>

    <div class="todo-box">
        <h2>Můj Úkolovník</h2>
        <div class="input-row">
            <input type="text" id="todo-input" placeholder="Přidat nový úkol...">
            <button onclick="addTodo()">Přidat</button>
        </div>
        <ul id="todo-list"></ul>
    </div>

    <script>
        let todos = JSON.parse(localStorage.getItem('todos')) || [];

        function renderTodos() {
            const list = document.getElementById('todo-list');
            list.innerHTML = '';
            todos.forEach((todo, index) => {
                const li = document.createElement('li');
                if (todo.completed) li.className = 'completed';
                
                li.innerHTML = `
                    <span onclick="toggleTodo(${index})" style="cursor:pointer; flex:1;">${todo.text}</span>
                    <button class="delete-btn" onclick="deleteTodo(${index})">Smazat</button>
                `;
                list.appendChild(li);
            });
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        function addTodo() {
            const input = document.getElementById('todo-input');
            if (input.value.trim() === '') return;
            todos.push({ text: input.value, completed: false });
            input.value = '';
            renderTodos();
        }

        function toggleTodo(index) {
            todos[index].completed = !todos[index].completed;
            renderTodos();
        }

        function deleteTodo(index) {
            todos.splice(index, 1);
            renderTodos();
        }

        // Přidání úkolu klávesou Enter
        document.getElementById('todo-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTodo();
        });

        renderTodos();
    </script>
</body>
</html>
